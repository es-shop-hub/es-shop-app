<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://esm.sh; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.gstatic.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com wss://*.firebaseio.com; font-src 'self' https://fonts.gstatic.com; frame-src 'self' https://*.firebaseapp.com https://accounts.google.com; worker-src 'self' blob:; base-uri 'self'; form-action 'self';">
  <title>StockFlow - Réinitialiser le mot de passe</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #F5F5F5; color: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }

    .container {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.15);
      width: 100%;
      max-width: 350px;
    }

    .container h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #0B3D2E;
    }

    .container label {
      font-size: 12px;
      display: block;
      margin-bottom: 5px;
    }

    .container input[type="email"] {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      outline: none;
    }

    .field-group {
      margin-bottom: 15px;
    }

    .btn-primary {
      width: 100%;
      padding: 12px;
      background: #0B3D2E;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    .btn-primary:active {
      transform: scale(0.97);
    }

    .link {
      display: block;
      text-align: center;
      margin-top: 15px;
      font-size: 12px;
      color: #0B3D2E;
      text-decoration: none;
    }

    .link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Réinitialiser le mot de passe</h2>
    <form id="resetPasswordForm">
      <div class="field-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="exemple@email.com" required autocomplete="email">
      </div>
      <button type="submit" class="btn-primary">Envoyer le lien de réinitialisation</button>
    </form>
    <a class="link" href="login.html">Retour à la connexion</a>
  </div>

  <script type="module" src="js/reset-password.js"></script>
</body>
</html>
