<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://esm.sh; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.gstatic.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com wss://*.firebaseio.com; font-src 'self' https://fonts.gstatic.com; frame-src 'self' https://*.firebaseapp.com https://accounts.google.com; worker-src 'self' blob:; base-uri 'self'; form-action 'self';">
  <meta name="theme-color" content="#0B3D2E">
  
<link rel="manifest" href="manifest.json">
  <title>StockFlow - vente</title>

<script type="module" src="js/index.js" defer></script>
<script src="js/ui.js" defer></script>
<script src="js/pwa.js" defer></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }

    body { background: #F5F5F5; color: #111; }

    header {
      background: #0B3D2E;
      color: white;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header .status { font-size: 12px; color: #D4AF37; }

    .search-bar {
      padding: 10px;
      position: sticky;
      top: 0;
      background: #F5F5F5;
      z-index: 10;
    }

    .search-bar input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 10px;
    }

    .product {
      position: relative;
      background: white;
      padding: 12px;
      border-radius: 12px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.08);
      cursor: pointer;
      transition: 0.2s;
      overflow: hidden;
      min-height: 100px;
    }

    .product:active { transform: scale(0.95); }

    /* IMAGE BACKGROUND */
    .product::before {
      content: "";
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0.15;
      z-index: 0;
    }

    .product-content {
      position: relative;
      z-index: 1;
    }

    .product h4 { font-size: 14px; }
    .product p { font-size: 12px; color: gray; }

    .exp-badge {
      position: absolute;
      top: 5px;
      right: 5px;
      z-index: 2;
      font-size: 9px;
      font-weight: 700;
      padding: 2px 5px;
      border-radius: 6px;
      line-height: 1.2;
      pointer-events: none;
      letter-spacing: 0.02em;
    }

    .product-expired {
      opacity: 0.72;
    }

    .product-expired .exp-badge {
      font-size: 8px;
    }

    .variant {
      font-size: 11px;
      color: #555;
    }

    .cart {
      position: fixed;
      bottom: 70px;
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: row;
      align-items: stretch;
      gap: 6px;
      background: #fff;
      padding: 0 8px 10px 10px;
      border-radius: 16px 16px 0 0;
      border-top: 4px solid #0B3D2E;
      box-shadow: 0 -4px 18px rgba(0,0,0,0.12);
      max-height: 280px;
      overflow: hidden;
      box-sizing: border-box;
    }

    .cart.cart-credit-open {
      max-height: min(480px, 60vh);
    }

    .cart-main {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .cart-header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 4px 8px;
      border-bottom: 1px solid #E5E7EB;
      margin-bottom: 8px;
    }

    .cart-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .cart-header-icon {
      font-size: 18px;
      line-height: 1;
    }

    .cart-header-title {
      font-size: 16px;
      font-weight: 800;
      color: #0B3D2E;
    }

    .cart-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      border-radius: 999px;
      background: #EDE9FE;
      color: #5B21B6;
      font-size: 12px;
      font-weight: 700;
    }

    .cart-clear-btn {
      appearance: none;
      border: none;
      background: #FEE2E2;
      color: #B91C1C;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      flex: 0 0 auto;
    }

    .cart-clear-btn:hover {
      background: #FECACA;
    }

    .cart-clear-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .cart-body {
      flex: 1 1 auto;
      min-width: 0;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-right: 2px;
    }

    .cart-scroll-controls {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      align-self: center;
    }

    .cart-scroll-btn {
      width: 20px;
      height: 20px;
      padding: 0;
      border: 1px solid #0B3D2E;
      border-radius: 5px;
      background: #0B3D2E;
      color: #fff;
      font-size: 9px;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
    }

    .cart-scroll-btn:active {
      transform: scale(0.95);
    }

    .cart-scroll-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .cart-item {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      padding: 10px 12px;
      background: #F3F4F6;
      border: 1px solid #E5E7EB;
      border-radius: 12px;
      box-sizing: border-box;
    }

    .cart-item-info {
      flex: 1 1 120px;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .cart-item-name {
      font-size: 14px;
      font-weight: 700;
      color: #111827;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cart-item-line {
      font-size: 12px;
      color: #6B7280;
      font-weight: 500;
      white-space: nowrap;
    }

    .cart-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 5px;
      flex: 1 1 auto;
    }

    .cart-step-btn {
      appearance: none;
      width: 28px;
      height: 28px;
      padding: 0;
      border: none;
      border-radius: 999px;
      background: #E5E7EB;
      color: #374151;
      font-size: 16px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
    }

    .cart-step-btn:active {
      transform: scale(0.95);
    }

    .cart-qty-input,
    .cart-price-input {
      width: 44px !important;
      min-width: 44px;
      height: 28px;
      box-sizing: border-box;
      padding: 2px 6px;
      border: 1px solid #D1D5DB;
      border-radius: 8px;
      background: #fff;
      color: #111;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
    }

    .cart-price-input {
      width: 64px !important;
      min-width: 56px;
    }

    .cart-ok-btn {
      appearance: none;
      border: none;
      background: #0B3D2E;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 999px;
      cursor: pointer;
      line-height: 1.2;
    }

    .cart-ok-btn:active {
      transform: scale(0.96);
    }

    .cart-del-btn {
      appearance: none;
      width: 28px;
      height: 28px;
      padding: 0;
      border: none;
      border-radius: 8px;
      background: #FEE2E2;
      color: #B91C1C;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      line-height: 1;
    }

    .cart-del-btn:hover {
      background: #FECACA;
    }

    .total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      padding: 10px 14px;
      border-radius: 999px;
      background: #E8F7EE;
      border: 1px solid #A8D5B5;
      color: #0B5C3A;
      font-weight: 700;
      font-size: 14px;
    }

    .total-label,
    .total-amount {
      color: #0B5C3A;
      font-weight: 700;
    }

    .payment-box {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 6px;
    }

    .payment-box #clientName {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
    }

    .cart-mode-btns {
      display: flex;
      gap: 8px;
    }

    .cart-mode-btns.hidden,
    .credit-panel.hidden {
      display: none;
    }

    .btn-sell-cash,
    .btn-sell-credit,
    .btn-confirm-credit,
    .btn-cancel-credit {
      flex: 1;
      padding: 11px 8px;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
    }

    .btn-sell-cash,
    .btn-confirm-credit {
      background: #1B7A4A;
    }

    .btn-sell-credit {
      background: #E67E22;
    }

    .btn-cancel-credit {
      background: #6B7280;
    }

    .btn-sell-cash:active,
    .btn-sell-credit:active,
    .btn-confirm-credit:active,
    .btn-cancel-credit:active {
      transform: scale(0.97);
    }

    .credit-panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
      background: #FFF8F0;
      border: 1px solid #E67E22;
      border-radius: 10px;
    }

    .credit-panel-title {
      font-size: 13px;
      font-weight: 700;
      color: #C15F12;
    }

    .credit-amount-label {
      font-size: 12px;
      color: #7A4A1A;
      font-weight: 600;
    }

    .credit-panel #amountPaid {
      display: block;
      width: 100%;
      box-sizing: border-box;
      min-height: 42px;
      padding: 8px 10px;
      border: 1px solid #E67E22;
      border-radius: 8px;
      font-size: 14px;
      background: #fff;
      color: #111;
    }

    .credit-remaining {
      padding: 8px 10px;
      border: 1px dashed #E67E22;
      border-radius: 8px;
      background: #fff;
      font-size: 13px;
      font-weight: 600;
      color: #9A3412;
    }

    .credit-panel-actions {
      display: flex;
      gap: 8px;
    }


    nav{
  position:fixed;
  left:0;
  bottom:0;

  width:100%;

  display:flex;
  justify-content:space-between;
  align-items:stretch;
  gap:8px;

  padding:8px 10px calc(8px + env(safe-area-inset-bottom));

  background:#111;

  border-top:1px solid rgba(255,255,255,0.08);

  z-index:1000;

  overflow:hidden;
}

nav .nav-item{
  flex:1;

  min-width:0;

  display:flex;
  flex-direction:column;

  justify-content:center;
  align-items:center;

  gap:4px;

  min-height:52px;

  padding:8px 4px;

  border-radius:10px;

  text-decoration:none;

  color:#E5E5E5;

  font-size:10px;
  font-weight:600;
  text-align:center;
  line-height:1.15;

  text-align:center;

  transition:
  background 0.2s ease,
  color 0.2s ease,
  transform 0.15s ease;

  overflow:hidden;
}

nav .nav-item span{
  width:100%;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

nav .nav-item:hover{
  background:rgba(212,175,55,0.08);
}

nav .nav-item:active{
  transform:scale(0.96);
}

nav .nav-item.active{
  background:rgba(212,175,55,0.12);
  color:#D4AF37;
}

@media(min-width:768px){

  nav{
    max-width:900px;

    left:50%;
    transform:translateX(-50%);

    border-radius:16px 16px 0 0;
  }

  nav .nav-item{
    font-size:12px;
  }

}

@media(min-width:1200px){

  nav{
    max-width:1000px;
  }

  }

    .fade-in {
      opacity: 0;
      transform: translateY(10px);
      transition: 0.4s;
    }

    .fade-in.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .custom-date {
      display: flex;
      align-items: center;
      margin-top: 5px;
      gap: 5px;
      font-size: 12px;
    }

    .custom-date input[type="date"] {
      padding: 4px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 12px;
    }
    
    /* espace pour éviter blocage */
.products {
  padding-bottom: 240px;
}

/* animation panier */
.cart {
  transition: transform 0.3s ease;
}

/* état réduit */
.cart.hidden {
  transform: translateY(85%);
}

/* bouton toggle */
#toggleCart {
  position: fixed;
  bottom: calc(60px + 220px + 5px); /* panier bottom + panier max-height + 10px de marge */
  right: 15px;
  width: 30px;      /* un peu plus petit */
  height: 30px;     /* idem */
  font-size: 10px;  /* réduire icône */
  background: #0B3D2E;
  color: white;
  border: none;
  border-radius: 50%;
  cursor: pointer;
  z-index: 1100;
}

  #installBtn {
    position: fixed;
    bottom: 15px;
    right: 15px;
    background: #0B3D2E;
    color: white;
    border: none;
    padding: 12px 14px;
    border-radius: 10px;
    z-index: 9999;
    font-weight: bold;
  }

  #installBtn:active {
    transform: scale(0.95);
  }
    /* calculator*/
  #calcBtn{
  position:fixed;
  right:14px;
  /* zone SAFE :
     jamais dans cart,
     jamais dans search,
     jamais dans nav */
  top:clamp(120px, 15vh, 280px);
  width:30px;
  height:30px;

  border:none;
  border-radius:50%;
  background:#0B3D2E;
  color:#fff;
  font-size:16px;
  cursor:pointer;
  z-index:11000;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 4px 10px rgba(0,0,0,.18);
  transition:transform .2s ease;
  -webkit-tap-highlight-color:transparent;
  }
#calcBtn:active{
  transform:scale(.95);
}
  </style>
<link rel="stylesheet" href="css/drawer.css">
</head>

<body>

<header>
  <h3>StockFlow - vente</h3>
  <div class="status" id="status">● Online</div>
  <button id="installBtn" hidden>
  Installer l’application
</button>
</header>
<div class="search-bar">
  <input type="text" placeholder="Rechercher un produit..." id="searchInput">
</div>
<button id="calcBtn" aria-label="Calculatrice">
  ➕
</button>

<!-- PRODUITS -->
<section class="products" id="productsContainer"></section>

<!-- PANIER -->
<div class="cart">
  <div class="cart-main">
    <div class="cart-header" id="cartHeader">
      <div class="cart-header-left">
        <span class="cart-header-icon" aria-hidden="true">🛒</span>
        <span class="cart-header-title">Panier</span>
        <span class="cart-badge" id="cartBadge">0</span>
      </div>
      <button type="button" class="cart-clear-btn" id="clearCartBtn">Vider</button>
    </div>
  <div class="cart-body" id="cartBody">

    <div class="custom-date">
      <input type="checkbox" id="manualDate">
      <label for="manualDate">Modifier date vente</label>
      <input type="date" id="saleDate" disabled>
    </div>

    <!-- items injectés JS (avant payment-box) -->

    <div class="payment-box" id="paymentBox">
      <input type="text" id="clientName" placeholder="Nom client" autocomplete="off">

      <div class="cart-mode-btns" id="cartModeBtns">
        <button type="button" class="btn-sell-cash" id="btnSellCash">Vendre à cash</button>
        <button type="button" class="btn-sell-credit" id="btnSellCredit">Vendre à crédit</button>
      </div>

      <div class="credit-panel hidden" id="creditPanel" aria-hidden="true">
        <div class="credit-panel-title" id="creditPanelTitle">Vente à crédit / Dette</div>
        <label class="credit-amount-label" for="amountPaid" id="amountPaidLabel">Argent à payer (optionnel)</label>
        <input type="number" id="amountPaid" name="amountPaid" min="0" step="any" placeholder="0 = toute la dette" inputmode="decimal" autocomplete="off">
        <div class="credit-remaining" id="creditRemaining">Reste dû (Dette) : 0</div>
        <div class="credit-panel-actions" id="creditPanelActions">
          <button type="button" class="btn-confirm-credit" id="btnConfirmCredit">Valider Crédit</button>
          <button type="button" class="btn-cancel-credit" id="btnCancelCredit">Revenir</button>
        </div>
      </div>
    </div>

    <div class="total" id="cartTotal">
      <span class="total-label" id="cartTotalLabel">Total :</span>
      <span class="total-amount" id="cartTotalAmount">0 FC</span>
    </div>
    </div>
  </div>

  <div class="cart-scroll-controls" id="cartScrollControls">
    <button type="button" class="cart-scroll-btn" id="cartScrollUp" aria-label="Défiler le panier vers le haut">▲</button>
    <button type="button" class="cart-scroll-btn" id="cartScrollDown" aria-label="Défiler le panier vers le bas">▼</button>
  </div>
</div>
<button id="toggleCart">🛒</button>
<!-- NAV -->
<script type="module" src="js/calcule.js"></script>
<script src="js/drawer.js" defer></script>
<script src="js/nav.js" defer></script>
</body>
  </html>
